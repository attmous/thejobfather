services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      JOBFATHER_DB: /data/profile.sqlite3
      JOBFATHER_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      JOBFATHER_ORIGINS: http://localhost:${JOBFATHER_PORT:-3000},http://127.0.0.1:${JOBFATHER_PORT:-3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
    volumes:
      - jobfather-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        JOBFATHER_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${JOBFATHER_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    init: true

volumes:
  jobfather-data:
